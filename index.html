<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Software Cartography</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav-principale">
        <a href="interface.html" class="nav-lien actif">Table</a>
        <a href="cartographie.html" class="nav-lien">Cartography</a>
        <span class="nav-spacer"></span>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme"></button>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <h1>Filters</h1>

            <div class="filtre-section">
                <h3>Licence</h3>
                <div class="filtre-licence">
                    <button class="filtre-btn actif" data-licence="tout">All</button>
                    <button class="filtre-btn" data-licence="libre">Free</button>
                    <button class="filtre-btn" data-licence="privateur">Proprietary</button>
                </div>
            </div>

            <div class="filtre-section">
                <h3>Platform</h3>
                <div id="filtrePlateformes" class="filtre-plateformes"></div>
            </div>

            <div class="filtre-section">
                <h3>Usages</h3>
                <div id="listeTags"></div>
            </div>
        </aside>

        <main class="main">
            <div class="main-header">
                <h2>Software</h2>
                <span><span id="compteurLogiciels">0</span> results</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Usages</th>
                        <th>Licence</th>
                        <th>Platforms</th>
                    </tr>
                </thead>
                <tbody id="listeLogiciels"></tbody>
            </table>
        </main>
    </div>

    <script src="data-utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
